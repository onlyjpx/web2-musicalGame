<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/icon-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicGuessr</title>
    <script>
      (function(){
        try {
          var d = document.documentElement;
          var stored = localStorage.getItem('theme'); // 'light' | 'dark' | 'system' | null
          var mql = window.matchMedia('(prefers-color-scheme: dark)');
          var systemDark = mql.matches;
          var wantDark = stored === 'dark' || (stored !== 'light' && systemDark);
          if (wantDark) d.classList.add('dark'); else d.classList.remove('dark');
          d.style.colorScheme = wantDark ? 'dark' : 'light';
          d.setAttribute('data-theme', wantDark ? 'dark' : 'light');
        } catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
